[package]
name = "blitz-website"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# Networking
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7"}
tower-http = { version = "0.6", features = ["fs", "trace"] }
reqwest = { version = "0.13", features = ["json"] }
zstd = "0.13"
flate2 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

# Content
fxhash = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dioxus = { version = "0.7.0-rc.0", default-features = false, features = ["html", "macro", "signals", "hooks"] }
dioxus-ssr = "0.7.0-rc.0"
wptreport = "0.0.13"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "html", "parsing"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dioxus-html-macro = "0.3.0"
dashmap = "6.1.0"
serde_json5 = "0.2.1"
foldhash = "0.2.0"
humansize = "2.1.3"
tempfile = "3.27.0"

# WPT report ingestion is ~5x slower unoptimized: lightly optimize our own
# code and fully optimize the hot dependencies (bundled SQLite, JSON stream
# parsing, decompression) even in dev builds
[profile.dev]
opt-level = 1

[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.rusqlite]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.serde]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zstd]
opt-level = 3
[profile.dev.package.zstd-safe]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

[build-dependencies]
grass = { version = "0.13", default-features = false }

[features]

