app = "blitz-website"

kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[env]
HOST = "::"
PORT = 3333
RUST_LOG = "info"
PRECACHE_DOWNLOADS = "true"
WPT_DATA_DIR = "/data"
# Decommit freed pages immediately (default: after 10ms). The delay is only
# checked when the owning thread next allocates, so a worker/blocking thread
# that finishes a ~30MB page render (or a 32MB report decode) and then idles
# never purges at all, and the process sits at its high-water mark after
# every traffic burst. All allocations, including the C dependencies', go
# through mimalloc (see the `mimalloc` feature in Cargo.toml).
MIMALLOC_PURGE_DELAY = "0"

[mounts]
  source = "wpt_data"
  destination = "/data"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 3333
  processes = ["app"]
  protocol = "tcp"
  script_checks = []

  [services.concurrency]
    hard_limit = 5000
    soft_limit = 1000
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"
